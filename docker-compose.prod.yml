services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentme-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SAGE_ENVIRONMENT: production
      SAGE_API_HOST: 0.0.0.0
      SAGE_POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/agentme
      SAGE_QDRANT_URL: http://qdrant:6333
      SAGE_OLLAMA_BASE_URL: http://host.docker.internal:11434
      SAGE_LM_STUDIO_BASE_URL: http://host.docker.internal:1234/v1
    ports:
      - "8000:8000"
    volumes:
      - ./Inbox:/app/Inbox
      - ./logs:/app/logs
      - ./data:/app/data
      - ./voices:/app/voices
      - ./migrations:/app/migrations:ro
      - ./scripts:/app/scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentme-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: agentme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentme"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentme-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  n8n:
    image: n8nio/n8n:latest
    container_name: agentme-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: America/New_York
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
